<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vetora - Student Onboarding Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#72dc91",
                        "primary-fixed": "#abeef6",
                        "on-surface-variant": "#3f484a",
                        "tertiary": "#383d3d",
                        "secondary": "#006d37",
                        "secondary-container": "#8ef9ab",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-bright": "#f9f9fc",
                        "surface-variant": "#e2e2e5",
                        "on-secondary-fixed": "#00210c",
                        "on-surface": "#1a1c1e",
                        "surface": "#f9f9fc",
                        "on-secondary-fixed-variant": "#005228",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#8ef9ab",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#90d2da",
                        "on-tertiary-fixed-variant": "#434848",
                        "on-tertiary-container": "#c4c8c8",
                        "primary-container": "#0d5c63",
                        "inverse-primary": "#8fd1d9",
                        "tertiary-container": "#4f5454",
                        "on-tertiary-fixed": "#181c1d",
                        "on-background": "#1a1c1e",
                        "outline": "#6f797a",
                        "outline-variant": "#bfc8c9",
                        "primary-fixed-dim": "#8fd1d9",
                        "surface-container-low": "#f3f3f6",
                        "surface-container-highest": "#e2e2e5",
                        "tertiary-fixed-dim": "#c3c7c7",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#dfe3e3",
                        "error-container": "#ffdad6",
                        "surface-container": "#eeeef0",
                        "on-primary-fixed": "#002023",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8ea",
                        "background": "#f9f9fc",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#00743a",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dadadc",
                        "inverse-surface": "#2f3133",
                        "primary": "#004349",
                        "surface-tint": "#20686f",
                        "on-primary-fixed-variant": "#004f55"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "gutter": "24px",
                        "xxl": "48px",
                        "md": "16px",
                        "margin-desktop": "64px",
                        "base": "4px",
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "60px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-ring:focus {
            box-shadow: 0 0 0 4px rgba(13, 92, 99, 0.1);
            border-color: #004349;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-gutter">
<!-- Top App Bar (Simplified for transactional page) -->
<header class="fixed top-0 left-0 right-0 w-full flex justify-center py-md z-50">
<div class="font-headline-md text-headline-md font-bold text-primary tracking-tight">
            Vetora
        </div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md w-full relative z-10">
<!-- Progress Indicator -->
<div class="mb-xl">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-md text-label-md text-primary">Step 1 of 5</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Basic Information</span>
</div>
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed-dim rounded-full transition-all duration-500 ease-in-out" style="width: 20%;"></div>
</div>
</div>
<!-- Onboarding Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_2px_4px_rgba(13,92,99,0.08)] p-xl relative overflow-hidden group hover:border-primary hover:shadow-[0_8px_16px_rgba(13,92,99,0.12)] transition-all duration-300">
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Welcome to Vetora</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's set up your academic profile. Precision starts here.</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center mb-lg">
<div class="w-24 h-24 rounded-full border-2 border-dashed border-outline-variant bg-surface-container flex items-center justify-center mb-sm cursor-pointer hover:bg-surface-container-high hover:border-primary transition-colors duration-200">
<span class="material-symbols-outlined text-outline" data-icon="add_a_photo" style="font-size: 32px;">add_a_photo</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Upload Photo</span>
</div>
<!-- Full Name -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md focus:outline-none input-focus-ring transition-all duration-200" id="fullName" name="fullName" placeholder="Dr. Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="email">Institution Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md focus:outline-none input-focus-ring transition-all duration-200" id="email" name="email" placeholder="jane.doe@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md focus:outline-none input-focus-ring transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-outline mt-1">Must be at least 8 characters.</p>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg hover:bg-on-primary-fixed-variant transition-colors duration-200 flex justify-center items-center group" type="submit">
                        Continue
                        <span class="material-symbols-outlined ml-2 text-[20px] group-hover:translate-x-1 transition-transform duration-200" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Transactional Footer -->
<div class="mt-xl text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                Already have an account? <a class="text-primary hover:underline font-bold transition-colors" href="#">Sign In</a>
</p>
</div>
</main>
<!-- Subtle Background Element -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-30">
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-container rounded-full blur-[100px]"></div>
<div class="absolute -bottom-40 -left-40 w-96 h-96 bg-secondary-container rounded-full blur-[100px]"></div>
</div>
</body></html>
